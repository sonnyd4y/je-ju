<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주 동네가게 도우미</title>
<meta name="description" content="공공데이터로 덜 붐비는 제주 동네 식당을 찾고, 동네 가게 홍보를 돕는 AI Agent">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f5c6e">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/app.css?v=3">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="/config.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">동</div><div class="name">제주 동네가게 도우미<small>공공데이터 AI Agent</small></div></div>
    <div class="seg" role="group" aria-label="사용자 유형">
      <button data-mode="tourist">여행객</button>
      <button data-mode="owner">사장님</button>
    </div>
    <button class="icon-btn" id="fontBtn" title="글자 크게" aria-label="글자 크게" aria-pressed="false" data-ic="text"></button>
  </header>
  <nav class="side" id="sideNav" aria-label="메뉴"></nav>
  <main id="main">
    <section class="view" id="v-home"></section>
    <section class="view full" id="v-map">
      <div class="map-bar" id="mapBar"></div>
      <div class="map-wrap"><div id="map" role="application" aria-label="제주 지도"></div>
        <details class="map-legend"><summary data-ic="info">범례</summary>
          <div class="lg">
            <span><i class="dot" style="background:#2f8f5b"></i>한산</span><span><i class="dot" style="background:#c58a14"></i>보통</span>
            <span><i class="dot" style="background:#d2453f"></i>붐빔</span><span class="muted">동네 이름표 · 핀의 점</span>
            <span><i class="dot" style="background:#6250d6"></i>관광지</span><span><i class="dot" style="background:#1baf7a"></i>오름</span>
            <span><i class="dot" style="background:#2a78d6"></i>해수욕장</span><span><i class="dot" style="background:#e87ba4"></i>명소</span>
            <span><i class="dot" style="background:#d9580b"></i>숨은 식당</span><span><i class="dot" style="background:#0f5c6e"></i>네이버 등록 식당</span>
          </div></details>
      </div>
    </section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-store"></section>
    <section class="view" id="v-make"></section>
    <section class="view full" id="v-chat">
      <div class="chat">
        <div class="thread" id="thread"><div class="thread-in" id="threadIn"></div></div>
        <div class="composer-wrap">
          <div class="attach-preview" id="attachPreview"><img alt=""><span>사진 1장 첨부됨</span><button id="attachClear">빼기</button></div>
          <form class="composer" id="form">
            <input type="file" id="file" accept="image/*" hidden>
            <button type="button" class="icon-btn" id="attachBtn" title="사진 올리기 (메뉴판·음식 사진)" aria-label="사진 올리기" data-ic="camera"></button>
            <button type="button" class="icon-btn mic" id="micBtn" title="말로 입력" aria-label="말로 입력" hidden data-ic="mic"></button>
            <textarea id="input" rows="1" placeholder="물어보세요" aria-label="메시지"></textarea>
            <button type="submit" class="icon-btn send" id="sendBtn" aria-label="보내기" data-ic="send"></button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <nav class="bottom" id="bottomNav" aria-label="메뉴"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js?v=4"></script>
</body>
</html>
