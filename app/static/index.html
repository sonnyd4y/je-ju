<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주 동네가게 도우미</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f5c6e">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f1ea; --surface: #ffffff; --surface-2: #faf7f2; --ink: #1c1b19; --muted: #6a645b; --line: #e6dfd3;
    --sea: #0f5c6e; --sea-soft: #e2eff1; --accent: #d9580b; --accent-soft: #fdeadc;
    --quiet: #2f8f5b; --quiet-soft: #dff1e6; --normal: #c98a12; --normal-soft: #fbefd2; --busy: #d2453f; --busy-soft: #fbe1df;
    --radius: 16px; --fs: 16px; --nav-h: 64px; --head-h: 60px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
  }
  body.large { --fs: 19px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-size: var(--fs); line-height: 1.55;
    font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--sea); }

  /* ---------- 레이아웃 ---------- */
  .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: var(--head-h) 1fr; height: 100dvh; }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05em; min-width: 0; margin-right: auto; }
  .brand .logo { width: 32px; height: 32px; border-radius: 10px; background: var(--sea); color: #fff; display: grid; place-items: center; font-weight: 900; flex-shrink: 0; }
  .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 999px; padding: 3px; flex-shrink: 0; }
  .seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; color: var(--muted); white-space: nowrap; min-height: 38px; }
  .seg button[aria-pressed="true"] { background: var(--sea); color: #fff; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex-shrink: 0; }
  .icon-btn svg { width: 20px; height: 20px; }

  nav.side { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 12px 14px; border-radius: 12px; font-weight: 700; color: var(--muted); text-align: left; min-height: 48px; }
  nav button svg { width: 22px; height: 22px; flex-shrink: 0; }
  nav button[aria-current="page"] { background: var(--sea-soft); color: var(--sea); }
  nav .foot { margin-top: auto; font-size: .78em; color: var(--muted); padding: 10px 14px; }

  main { overflow-y: auto; min-width: 0; position: relative; }
  .view { display: none; padding: 24px; max-width: 980px; margin: 0 auto; }
  .view.active { display: block; }
  .view.full { max-width: none; padding: 0; height: 100%; }
  .view.full.active { display: flex; flex-direction: column; }

  nav.bottom { display: none; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: var(--head-h) 1fr var(--nav-h); }
    nav.side { display: none; }
    nav.bottom {
      display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav.bottom button { flex-direction: column; justify-content: center; gap: 2px; padding: 6px 2px; font-size: .72em; border-radius: 0; text-align: center; }
    nav.bottom button[aria-current="page"] { background: none; color: var(--sea); }
    header { padding: 0 12px; gap: 8px; }
    .brand { font-size: .95em; }
    .brand .logo { width: 28px; height: 28px; border-radius: 8px; }
    .seg button { padding: 6px 10px; font-size: .85em; }
    .view { padding: 16px; }
  }
  @media (max-width: 380px) { .brand span { display: none; } }
  @media (max-width: 860px) {
    /* 휴대폰: 선택 줄을 한 줄 가로 스크롤로 → 결과가 첫 화면에 보이게 */
    .controls { gap: 10px; padding: 14px; }
    .controls .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 2px; }
    .controls .chips::-webkit-scrollbar { display: none; }
    .controls .chip { min-height: 36px; padding: 6px 12px; }
    .controls label { margin-bottom: 4px; }
    .hero { padding: 16px 18px; border-radius: 16px; }
    .hero h1 { font-size: 1.2em; }
    .hero p { font-size: .85em; }
    .map-bar { flex-wrap: nowrap; overflow-x: auto; }
    .map-bar .chips { flex-wrap: nowrap; }
    .grid.quick { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .grid.quick .tile { min-height: 0; padding: 12px 8px; align-items: center; text-align: center; }
    .grid.quick .tile span:not(.ic) { display: none; }
    .grid.quick .tile b { font-size: .85em; }
    #changeStore { min-height: 0; padding: 6px 10px; font-size: .8em; border-radius: 10px; }
  }

  /* ---------- 공통 요소 ---------- */
  h1.page { font-size: 1.5em; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  h2.sec { font-size: 1.08em; margin: 28px 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h2.sec .hint { font-weight: 500; font-size: .8em; color: var(--muted); margin-left: auto; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 12px; }
  .grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 860px) { .grid.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .grid.c2, .grid.c3 { grid-template-columns: 1fr; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; min-height: 40px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .controls { display: grid; gap: 14px; }
  .controls label { font-size: .82em; font-weight: 700; color: var(--muted); display: block; margin-bottom: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=date], input[type=time], select, input[type=text], input[type=search] {
    border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--surface); min-height: 42px;
  }
  .btn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 800; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.sea { background: var(--sea); color: #fff; }
  .btn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--muted); }
  .small { font-size: .82em; }
  .source { font-size: .76em; color: var(--muted); margin-top: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 12px; }
  .skeleton { height: 64px; border-radius: 12px; background: linear-gradient(90deg, #eee8dd 0%, #f6f2ea 50%, #eee8dd 100%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .78em; font-weight: 800; white-space: nowrap; }
  .lv-한산 { background: var(--quiet-soft); color: var(--quiet); }
  .lv-보통 { background: var(--normal-soft); color: #8a5d00; }
  .lv-붐빔 { background: var(--busy-soft); color: var(--busy); }
  .lv-정보없음, .lv-none { background: #eee; color: #777; }
  .b-hidden { background: var(--accent-soft); color: var(--accent); }
  .b-listed { background: var(--sea-soft); color: var(--sea); }
  .b-unknown { background: #eee; color: #666; }

  /* 혼잡 */
  .crowd-list { display: grid; gap: 10px; }
  .crowd-row { display: grid; grid-template-columns: 84px 1fr 64px; align-items: center; gap: 10px; }
  .crowd-row .bar { height: 12px; border-radius: 999px; background: #eee6d8; overflow: hidden; }
  .crowd-row .bar i { display: block; height: 100%; border-radius: 999px; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .slot { border-radius: 10px; padding: 8px 4px; text-align: center; font-size: .78em; font-weight: 700; }
  .slot b { display: block; font-size: 1.05em; }
  .heat { display: grid; grid-template-columns: 34px repeat(5, 1fr); gap: 4px; font-size: .78em; }
  .heat div { padding: 7px 0; text-align: center; border-radius: 6px; }
  .heat .h { color: var(--muted); font-weight: 700; background: none; }

  /* 가게 카드 */
  .store { display: grid; gap: 8px; }
  .store .top { display: flex; align-items: flex-start; gap: 10px; }
  .store .name { font-weight: 800; font-size: 1.05em; }
  .store .meta { color: var(--muted); font-size: .85em; }
  .score { margin-left: auto; text-align: right; font-weight: 900; color: var(--sea); font-size: 1.2em; line-height: 1; }
  .score small { display: block; font-size: .55em; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .parts { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: #eee6d8; }
  .parts i:nth-child(1) { background: var(--quiet); } .parts i:nth-child(2) { background: var(--sea); }
  .parts i:nth-child(3) { background: var(--accent); } .parts i:nth-child(4) { background: #8b6f47; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .75em; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; }
  .store .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .store .acts a, .store .acts button { font-size: .82em; font-weight: 700; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 6px 10px; text-decoration: none; color: var(--ink); }

  /* 일정 */
  .tl { display: grid; grid-template-columns: 54px 36px 1fr; gap: 10px; align-items: start; }
  .tl .time { font-weight: 800; padding-top: 14px; text-align: right; }
  .tl .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center; margin-top: 6px; }
  .tl .body { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 4px 0; }
  .tl .body .t { font-weight: 800; }
  .move { display: grid; grid-template-columns: 54px 36px 1fr; gap: 10px; color: var(--muted); font-size: .8em; }
  .move .line { width: 2px; height: 24px; background: var(--line); margin: 0 auto; }
  .move span { align-self: center; }

  /* 지도 */
  #map { flex: 1; min-height: 300px; }
  .mini-map { height: 260px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); margin-top: 12px; }
  .map-bar { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .map-bar .chip { min-height: 36px; padding: 6px 12px; font-size: .88em; }
  .map-legend { position: absolute; z-index: 500; left: 12px; bottom: 16px; right: 12px; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: .78em; box-shadow: var(--shadow); }
  .map-legend span { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; }
  .map-legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .poi-icon { width: 30px; height: 30px; font-size: 16px; line-height: 26px; text-align: center; background: #fff; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .leaflet-popup-content { font-family: inherit; font-size: 14px; line-height: 1.5; }

  /* 홈 */
  .tile { display: flex; flex-direction: column; gap: 6px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-height: 108px; }
  .tile .ic { font-size: 1.6em; }
  .tile span:not(.ic) { color: var(--muted); font-size: .82em; }
  .tile:hover { border-color: var(--sea); }
  .hero { background: linear-gradient(135deg, var(--sea) 0%, #16788f 100%); color: #fff; border-radius: 20px; padding: 22px; margin-bottom: 14px; }
  .hero h1 { margin: 0 0 4px; font-size: 1.45em; }
  .hero p { margin: 0; opacity: .9; }

  /* 내 가게 */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi .l { font-size: .76em; color: var(--muted); font-weight: 700; }
  .kpi .v { font-size: 1.15em; font-weight: 900; margin-top: 2px; }
  .stack { display: flex; height: 26px; border-radius: 8px; overflow: hidden; }
  .stack i { display: grid; place-items: center; color: #fff; font-size: .74em; font-weight: 800; font-style: normal; white-space: nowrap; overflow: hidden; }
  .hbar { display: grid; grid-template-columns: 96px 1fr 40px; gap: 8px; align-items: center; font-size: .85em; margin: 6px 0; }
  .hbar .b { height: 10px; border-radius: 999px; background: #eee6d8; overflow: hidden; }
  .hbar .b i { display: block; height: 100%; background: var(--sea); }
  .quote { background: var(--surface-2); border-left: 3px solid var(--line); padding: 6px 10px; border-radius: 6px; font-size: .85em; margin: 4px 0; }
  .search-results { display: grid; gap: 8px; margin-top: 12px; }
  .search-results button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; }

  /* 대화 */
  .chat { display: flex; flex-direction: column; height: 100%; }
  .thread { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .thread-in { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; flex-direction: column; gap: 10px; }
  .msg.user { align-items: flex-end; }
  .bubble { max-width: 92%; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--sea); color: #fff; border-color: var(--sea); white-space: pre-wrap; }
  .msg.user img.attach { max-width: 200px; border-radius: 12px; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 1em; margin: 12px 0 4px; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 1.25em; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 6px 0 10px; font-size: .93em; }
  .bubble th, .bubble td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  .bubble td:first-child, .bubble th { white-space: nowrap; }
  .bubble blockquote { margin: 8px 0; padding: 8px 12px; background: var(--sea-soft); border-left: 4px solid var(--sea); border-radius: 8px; }
  .bubble .src { display: block; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: .76em; color: var(--muted); }
  .bubble .gls { display: block; margin-top: 6px; font-size: .82em; color: var(--muted); }
  .widget { max-width: 92%; }
  .steps { font-size: .82em; color: var(--muted); max-width: 92%; }
  .steps summary { cursor: pointer; list-style: none; }
  .steps summary::-webkit-details-marker { display: none; }
  .steps ol { margin: 6px 0 0; padding-left: 1.2em; }
  .steps li.done::marker { color: var(--quiet); }
  .spin { display: inline-block; width: .9em; height: .9em; border: 2px solid var(--line); border-top-color: var(--sea); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .card-out img { display: block; width: 100%; max-width: 420px; border-radius: 12px; margin: 0 auto; }
  .card-out .acts { display: flex; gap: 10px; margin-top: 12px; }
  .card-out .acts .btn { flex: 1; }
  .error { background: #fff1ec; border: 1px solid #f3c3ad; color: #8a2e0a; border-radius: var(--radius); padding: 12px 16px; max-width: 92%; }
  .starter { display: grid; gap: 10px; }
  .starter button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .composer-wrap { background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px; }
  .attach-preview { max-width: 780px; margin: 0 auto 8px; display: none; align-items: center; gap: 10px; font-size: .85em; color: var(--muted); }
  .attach-preview img { height: 52px; border-radius: 8px; }
  .attach-preview button { border: 0; background: none; color: var(--accent); font-weight: 700; }
  .composer { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; min-width: 0; resize: none; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); min-height: 50px; max-height: 160px; background: var(--surface-2); }
  .composer textarea:focus { outline: 2px solid var(--sea); border-color: transparent; }
  .composer .icon-btn { width: 50px; height: 50px; border-radius: 14px; }
  .composer .send { background: var(--accent); border-color: var(--accent); color: #fff; }
  .composer .mic.on { background: var(--busy); border-color: var(--busy); color: #fff; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .gallery a { display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); }
  .gallery img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
  .gallery span { display: block; padding: 6px 10px; font-size: .78em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">동</div><span>제주 동네가게 도우미</span></div>
    <div class="seg" role="group" aria-label="사용자 유형">
      <button data-mode="tourist">여행객</button>
      <button data-mode="owner">사장님</button>
    </div>
    <button class="icon-btn" id="fontBtn" title="글자 크게" aria-label="글자 크게" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18 9 6l5 12M6 14h6M15 18l3-8 3 8M16 16h4"/></svg>
    </button>
  </header>
  <nav class="side" id="sideNav"></nav>
  <main id="main">
    <section class="view" id="v-home"></section>
    <section class="view full" id="v-map">
      <div class="map-bar" id="mapBar"></div>
      <div style="position:relative;flex:1;display:flex"><div id="map"></div>
        <div class="map-legend"><span><i style="background:var(--quiet)"></i>한산</span><span><i style="background:var(--normal)"></i>보통</span><span><i style="background:var(--busy)"></i>붐빔</span><span>⛰오름 🏖해수욕장 🏛관광지 📍명소 <i style="background:var(--accent)"></i>식당</span></div>
      </div>
    </section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-store"></section>
    <section class="view" id="v-make"></section>
    <section class="view full" id="v-chat">
      <div class="chat">
        <div class="thread" id="thread"><div class="thread-in" id="threadIn"></div></div>
        <div class="composer-wrap">
          <div class="attach-preview" id="attachPreview"><img alt=""><span>사진 1장 첨부됨</span><button id="attachClear">빼기</button></div>
          <form class="composer" id="form">
            <input type="file" id="file" accept="image/*" hidden>
            <button type="button" class="icon-btn" id="attachBtn" title="사진 올리기 (메뉴판·음식 사진)" aria-label="사진 올리기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <button type="button" class="icon-btn mic" id="micBtn" title="말로 입력" aria-label="말로 입력" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="무엇을 도와드릴까요?" aria-label="메시지"></textarea>
            <button type="submit" class="icon-btn send" id="sendBtn" aria-label="보내기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <nav class="bottom" id="bottomNav"></nav>
</div>

<script>
/* ================= 공통 ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `오류 ${r.status}`);
  return r.json();
}
const LV = (lv) => `<span class="badge lv-${esc((lv || "none").replace(/\s/g, ""))}">${esc(lv || "정보 없음")}</span>`;
const LV_COLOR = { "한산": "#2f8f5b", "보통": "#c98a12", "붐빔": "#d2453f" };
const NAVER_BADGE = (n) => n === "미등록 후보" ? `<span class="badge b-hidden">숨은 가게 · 네이버 미등록</span>`
  : n === "등록" ? `<span class="badge b-listed">네이버 등록</span>` : `<span class="badge b-unknown">네이버 미확인</span>`;
const naverSearch = (q) => `https://map.naver.com/p/search/${encodeURIComponent(q)}`;
const ICONS = {
  home: '<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',
  plan: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M8 17h6"/>',
  chat: '<path d="M4 5h16v11H8l-4 4z"/>',
  store: '<path d="M4 9 5 4h14l1 5M4 9h16v11H4zM9 20v-6h6v6"/>',
  make: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const TABS = {
  tourist: [["home", "홈", "home"], ["map", "지도", "map"], ["plan", "일정", "plan"], ["chat", "대화", "chat"]],
  owner: [["store", "내 가게", "store"], ["map", "지도", "map"], ["make", "만들기", "make"], ["chat", "대화", "chat"]],
};
const REGION_CHIPS = ["애월", "한림", "한경", "구좌", "조천", "성산", "표선", "남원", "안덕", "대정", "중문동", "서귀동", "연동", "노형동", "이도2동", "삼도2동"];
const SLOTS = ["아침", "점심", "오후", "저녁", "밤"];

let mode = store.get("mode", "tourist"), current = "";
const state = { regions: store.get("regions", ["애월", "한림", "구좌"]), day: store.get("day", "today"), slot: store.get("slot", "점심") };

function dateFor(day) {
  if (/^\d{4}-\d{2}-\d{2}$/.test(day)) return day;
  const d = new Date();
  if (day === "tomorrow") d.setDate(d.getDate() + 1);
  if (day === "sat") d.setDate(d.getDate() + (((6 - d.getDay()) + 7) % 7 || 7));
  if (day === "sun") d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const dayLabel = (day) => ({ today: "오늘", tomorrow: "내일", sat: "이번 토요일", sun: "이번 일요일" }[day] || day);

/* ================= 탐색 ================= */
function renderNav() {
  const html = TABS[mode].map(([id, label, ic]) => `<button data-go="${id}">${svg(ic)}<span>${label}</span></button>`).join("");
  $("#sideNav").innerHTML = html + `<div class="foot">공공데이터 기반 · 혼잡은 과거 패턴 예측(실시간 아님)</div>`;
  $("#bottomNav").innerHTML = html;
  document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => go(b.dataset.go)));
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
}
function go(id) {
  current = id;
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === "v-" + id));
  document.querySelectorAll("[data-go]").forEach((b) => b.setAttribute("aria-current", b.dataset.go === id ? "page" : "false"));
  history.replaceState(null, "", "#" + id);
  ({ home: renderHome, map: renderMap, plan: renderPlan, store: renderStore, make: renderMake, chat: renderChatEmpty })[id]?.();
}
function setMode(m) {
  if (m === mode) return;
  mode = m; store.set("mode", m); chat.sessionId = ""; $("#threadIn").innerHTML = "";
  renderNav(); go(TABS[m][0][0]);
}
document.querySelectorAll(".seg button").forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
$("#fontBtn").onclick = () => {
  const on = document.body.classList.toggle("large");
  $("#fontBtn").setAttribute("aria-pressed", String(on)); store.set("large", on);
};
if (store.get("large", false)) $("#fontBtn").click();

/* ================= 공통 조각 ================= */
function controlsHTML(opts = {}) {
  const days = ["today", "tomorrow", "sat", "sun"];
  return `<div class="controls card">
    <div><label>동네 (여러 곳을 고르면 덜 붐비는 곳으로 나눠 추천해요, 최대 4곳)</label><div class="chips" data-ctl="regions">
      ${REGION_CHIPS.map((r) => `<button class="chip" data-v="${r}" aria-pressed="${state.regions.includes(r)}">${r}</button>`).join("")}</div></div>
    <div><label>날짜</label><div class="chips" data-ctl="day">
      ${days.map((d) => `<button class="chip" data-v="${d}" aria-pressed="${state.day === d}">${dayLabel(d)}</button>`).join("")}
      <input type="date" data-ctl="date" value="${/^\d{4}/.test(state.day) ? state.day : ""}" aria-label="날짜 직접 고르기"></div></div>
    ${opts.slot === false ? "" : `<div><label>시간</label><div class="chips" data-ctl="slot">
      ${SLOTS.map((s) => `<button class="chip" data-v="${s}" aria-pressed="${state.slot === s}">${s}</button>`).join("")}</div></div>`}
  </div>`;
}
function bindControls(root, onChange) {
  root.querySelectorAll("[data-ctl=regions] .chip").forEach((b) => (b.onclick = () => {
    const v = b.dataset.v, on = state.regions.includes(v);
    if (on && state.regions.length === 1) return;
    state.regions = on ? state.regions.filter((x) => x !== v) : [...state.regions, v].slice(-4);
    store.set("regions", state.regions); onChange();
  }));
  root.querySelectorAll("[data-ctl=day] .chip").forEach((b) => (b.onclick = () => { state.day = b.dataset.v; store.set("day", state.day); onChange(); }));
  const di = root.querySelector("[data-ctl=date]");
  if (di) di.onchange = () => { if (di.value) { state.day = di.value; store.set("day", state.day); onChange(); } };
  root.querySelectorAll("[data-ctl=slot] .chip").forEach((b) => (b.onclick = () => { state.slot = b.dataset.v; store.set("slot", state.slot); onChange(); }));
}
function storeCard(s, opts = {}) {
  const w = s.score_parts ? Object.values(s.score_parts) : [];
  const tot = w.reduce((a, b) => a + b, 0) || 1;
  return `<div class="card store">
    <div class="top"><div><div class="name">${esc(s.name)}</div>
      <div class="meta">${esc(s.category || "")} · ${esc(s.region || "")}${s.years_open != null ? ` · ${Math.round(s.years_open)}년째` : ""}</div></div>
      ${s.score != null ? `<div class="score">${s.score.toFixed(2)}<small>추천 점수</small></div>` : ""}</div>
    <div class="row">${NAVER_BADGE(s.naver)}</div>
    ${w.length ? `<div class="parts" title="${esc(Object.entries(s.score_parts).map(([k, v]) => `${k} ${v}`).join(" · "))}">${w.map((v) => `<i style="width:${(v / tot) * 100}%"></i>`).join("")}</div>` : ""}
    <div class="meta">${esc(s.address || "")}</div>
    <div class="acts"><a href="${naverSearch(s.name + " " + (s.region || ""))}" target="_blank" rel="noopener">네이버 지도에서 보기</a>
      ${opts.ask !== false ? `<button data-ask="${esc(s.name)} (${esc(s.region || "")}) 어떤 곳이에요? 언제 가면 덜 붐벼요?">AI에게 물어보기</button>` : ""}</div>
  </div>`;
}
function bindAsk(root) { root.querySelectorAll("[data-ask]").forEach((b) => (b.onclick = () => askAI(b.dataset.ask))); }
const PARTS_LEGEND = `<div class="legend"><span><i style="background:var(--quiet)"></i>덜 붐빔</span><span><i style="background:var(--sea)"></i>생활권 여유</span><span><i style="background:var(--accent)"></i>숨은 가게</span><span><i style="background:#8b6f47"></i>오래된 가게</span></div>`;

/* ================= 여행객 홈 ================= */
async function renderHome() {
  const v = $("#v-home");
  v.innerHTML = `<div class="hero"><h1>덜 붐비는 제주, 동네 식당으로</h1><p>${esc(dayLabel(state.day))} ${esc(state.slot)} 기준 · 공공데이터로 고른 추천이에요</p></div>
    ${controlsHTML()}
    <h2 class="sec">동네별 붐빔 <span class="hint">식당 혼잡 예측 · 과거 패턴</span></h2><div id="homeCrowd" class="card"><div class="skeleton"></div></div>
    <h2 class="sec">추천 동네 식당 <span class="hint">다기준 점수 순</span></h2>${PARTS_LEGEND}
    <div id="homeRec" class="grid c2" style="margin-top:10px"><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="grid c2" style="margin-top:20px">
      <button class="tile" data-go2="plan"><span class="ic">🗓</span><b>하루 일정 짜기</b><span>관광지·오름·해수욕장과 식당을 덜 붐비는 순서로</span></button>
      <button class="tile" data-go2="map"><span class="ic">🗺</span><b>지도로 보기</b><span>동네 혼잡 색과 관광 장소·식당 위치</span></button>
    </div>`;
  bindControls(v, renderHome);
  v.querySelectorAll("[data-go2]").forEach((b) => (b.onclick = () => go(b.dataset.go2)));
  try {
    const rec = await api(`/api/recommend?regions=${encodeURIComponent(state.regions.join(","))}&when=${dateFor(state.day)}&time_slot=${encodeURIComponent(state.slot)}&limit=6`);
    const order = { "한산": 0, "보통": 1, "붐빔": 2 };
    const regs = rec.regions.filter((r) => !r.error).sort((a, b) => order[a.crowd_level] - order[b.crowd_level]);
    $("#homeCrowd").innerHTML = `<div class="crowd-list">${regs.map((r) => `
      <div class="crowd-row"><b>${esc(r.region)}</b><div class="bar"><i style="width:${{ "한산": 30, "보통": 62, "붐빔": 95 }[r.crowd_level]}%;background:${LV_COLOR[r.crowd_level]}"></i></div>${LV(r.crowd_level)}</div>`).join("")}</div>
      <div class="source">${esc(regs[0]?.when || "")} 기준 · 도민 생활권: ${regs.map((r) => `${esc(r.region)} ${esc(r.balance || "")}`).join(", ")}</div>`;
    $("#homeRec").innerHTML = rec.recommendations.map((s) => storeCard(s)).join("") + `<div class="source" style="grid-column:1/-1">근거: ${esc(rec.sources.join(", "))}</div>`;
    bindAsk($("#homeRec"));
  } catch (e) { $("#homeRec").innerHTML = `<div class="error">${esc(e.message)}</div>`; $("#homeCrowd").innerHTML = ""; }
}

/* ================= 지도 ================= */
let mapObj = null, mapLayers = {}, mapCache = { key: "", data: null };
const MAP_KINDS = [["areas", "동네 혼잡"], ["관광지", "🏛 관광지"], ["오름", "⛰ 오름"], ["해수욕장", "🏖 해수욕장"], ["명소", "📍 명소"], ["stores", "● 식당"]];
let mapOn = store.get("mapOn", ["areas", "관광지", "해수욕장", "명소", "stores"]);
function renderMap() {
  $("#mapBar").innerHTML = `<div class="chips">${MAP_KINDS.map(([k, l]) => `<button class="chip" data-k="${k}" aria-pressed="${mapOn.includes(k)}">${l}</button>`).join("")}</div>
    <div class="chips" style="margin-left:auto">${SLOTS.map((s) => `<button class="chip" data-s="${s}" aria-pressed="${state.slot === s}">${s}</button>`).join("")}</div>`;
  $("#mapBar").querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => {
    const k = b.dataset.k; mapOn = mapOn.includes(k) ? mapOn.filter((x) => x !== k) : [...mapOn, k]; store.set("mapOn", mapOn);
    b.setAttribute("aria-pressed", String(mapOn.includes(k))); drawMap();
  }));
  $("#mapBar").querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => { state.slot = b.dataset.s; store.set("slot", state.slot); renderMap(); }));
  if (!mapObj) {
    mapObj = L.map("map").setView([33.38, 126.55], 10);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(mapObj);
  }
  setTimeout(() => mapObj.invalidateSize(), 60);
  drawMap();
}
async function drawMap() {
  const key = `${dateFor(state.day)}|${state.slot}`;
  if (mapCache.key !== key) mapCache = { key, data: await api(`/api/map?when=${dateFor(state.day)}&time_slot=${encodeURIComponent(state.slot)}`) };
  const d = mapCache.data;
  Object.values(mapLayers).forEach((l) => mapObj.removeLayer(l));
  mapLayers = {};
  if (mapOn.includes("areas")) {
    mapLayers.areas = L.layerGroup(d.areas.map((a) => L.circle([a.lat, a.lng], { radius: 2600, color: LV_COLOR[a.level], fillColor: LV_COLOR[a.level], fillOpacity: .25, weight: 1 })
      .bindPopup(`<b>${esc(a.name)}</b><br>${esc(a.when)}<br>식당 혼잡: ${LV(a.level)}`))).addTo(mapObj);
  }
  const ico = { "관광지": "🏛", "오름": "⛰", "해수욕장": "🏖", "명소": "📍" };
  for (const k of Object.keys(ico)) {
    if (!mapOn.includes(k)) continue;
    mapLayers[k] = L.layerGroup(d.pois.filter((p) => p.kind === k).map((p) => L.marker([p.lat, p.lng], {
      icon: L.divIcon({ className: "", html: `<div class="poi-icon" style="border-color:${LV_COLOR[p.level] || "#fff"}">${ico[k]}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }),
    }).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.kind)} · ${esc(p.emd)}<br>이번 달 붐빔: ${LV(p.level)}<br><a href="${naverSearch("제주 " + p.name)}" target="_blank" rel="noopener">네이버 지도</a>`))).addTo(mapObj);
  }
  if (mapOn.includes("stores")) {
    mapLayers.stores = L.layerGroup(d.stores.map((s) => L.circleMarker([s.lat, s.lng], { radius: 5, color: "#fff", weight: 1, fillColor: "#d9580b", fillOpacity: .9 })
      .bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.category || "")} · ${esc(s.emd || "")}<br><a href="${naverSearch(s.name + " " + (s.emd || ""))}" target="_blank" rel="noopener">네이버 지도</a>`))).addTo(mapObj);
  }
}

/* ================= 일정 ================= */
const planState = { start: store.get("pstart", "10:00"), stops: store.get("pstops", "3"), meals: store.get("pmeals", "점심"), kinds: store.get("pkinds", ["관광지", "오름", "해수욕장", "명소"]) };
let planMap = null;
async function renderPlan() {
  const v = $("#v-plan");
  v.innerHTML = `<h1 class="page">하루 일정 짜기</h1><p class="sub">덜 붐비는 관광 장소와 동네 식당을 가까운 순서로 이어 드려요</p>
    ${controlsHTML({ slot: false })}
    <div class="card controls" style="margin-top:12px"><div class="row">
      <div><label>출발</label><select data-p="start">${["08:00", "09:00", "10:00", "11:00", "13:00"].map((t) => `<option ${t === planState.start ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div><label>관광 장소 수</label><select data-p="stops">${["2", "3", "4", "5"].map((n) => `<option ${n == planState.stops ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div><label>식사</label><select data-p="meals">${["점심", "점심,저녁"].map((m) => `<option value="${m}" ${m === planState.meals ? "selected" : ""}>${m.replace(",", " + ")}</option>`).join("")}</select></div>
    </div>
    <div><label>장소 종류</label><div class="chips" data-p="kinds">${["관광지", "오름", "해수욕장", "명소"].map((k) => `<button class="chip" data-v="${k}" aria-pressed="${planState.kinds.includes(k)}">${k}</button>`).join("")}</div></div>
    </div>
    <div id="planOut" style="margin-top:16px"><div class="skeleton" style="height:240px"></div></div>`;
  bindControls(v, renderPlan);
  v.querySelectorAll("select[data-p]").forEach((s) => (s.onchange = () => { planState[s.dataset.p] = s.value; store.set("p" + s.dataset.p, s.value); renderPlan(); }));
  v.querySelectorAll("[data-p=kinds] .chip").forEach((b) => (b.onclick = () => {
    const k = b.dataset.v, on = planState.kinds.includes(k);
    if (on && planState.kinds.length === 1) return;
    planState.kinds = on ? planState.kinds.filter((x) => x !== k) : [...planState.kinds, k]; store.set("pkinds", planState.kinds); renderPlan();
  }));
  try {
    const q = new URLSearchParams({ regions: state.regions.join(","), when: dateFor(state.day), start: planState.start, stops: planState.stops, meals: planState.meals, kinds: planState.kinds.join(",") });
    const r = await api(`/api/itinerary?${q}`);
    $("#planOut").innerHTML = itineraryHTML(r) + `<div class="mini-map" id="planMap"></div>
      <div class="row" style="margin-top:12px"><button class="btn sea" id="planAsk">AI에게 이 일정 다듬기</button></div>`;
    drawPlanMap(r);
    $("#planAsk").onclick = () => askAI(`${state.regions.join(", ")}에서 ${dayLabel(state.day)} ${planState.start} 출발 하루 일정 짜 주세요. 식사는 ${planState.meals.replace(",", "과 ")}.`);
  } catch (e) { $("#planOut").innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}
function itineraryHTML(r) {
  const items = r.itinerary.map((p, i) => `${i && p.travel_min ? `<div class="move"><span></span><div class="line"></div><span>🚗 약 ${p.travel_min}분 · ${p.distance_km}km</span></div>` : ""}
    <div class="tl"><div class="time">${esc(p.arrive)}</div><div class="dot">${p.icon}</div>
      <div class="body"><div class="row"><span class="t">${esc(p.name)}</span>${LV(p.level)}${p.naver ? NAVER_BADGE(p.naver) : ""}</div>
      <div class="small muted">${esc(p.kind === "식사" ? `${p.meal} · ${p.category || ""}` : p.kind)} · ${p.stay_min}분 머무르기 ·
        <a href="${naverSearch("제주 " + p.name)}" target="_blank" rel="noopener">네이버 지도</a></div></div></div>`).join("");
  return `<div class="card"><div class="row" style="margin-bottom:10px"><b>${esc(r.regions.join(" · "))}</b><span class="muted small">${esc(r.date || "")} · ${esc(r.ends_at)} 끝 · 이동 합계 ${r.total_travel_min}분</span></div>

}
function drawPlanMap(r) {
  if (planMap) { planMap.remove(); planMap = null; }
  planMap = L.map("planMap", { zoomControl: false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(planMap);
  const pts = r.itinerary.map((p) => [p.lat, p.lng]);
  r.itinerary.forEach((p, i) => L.marker([p.lat, p.lng], { icon: L.divIcon({ className: "", html: `<div class="poi-icon">${p.icon}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) })
    .bindTooltip(`${i + 1}. ${p.name} (${p.arrive})`).addTo(planMap));
  L.polyline(pts, { color: "#0f5c6e", weight: 3, dashArray: "6 6" }).addTo(planMap);
  planMap.fitBounds(L.latLngBounds(pts).pad(0.25));
}

function md(text) {
  let src = "", gls = "";
  const body = text.split("\n").filter((l) => {
    const t = l.replace(/^\**|\**$/g, "").trim();
    if (/^근거\s*[:：]/.test(t)) { src = t; return false; }
    if (/^※\s*용어/.test(t)) { gls = t; return false; }
    return true;
  }).join("\n");
  return DOMPurify.sanitize(marked.parse(body)) + (gls ? `<span class="gls">${esc(gls)}</span>` : "") + (src ? `<span class="src">${esc(src)}</span>` : "");
}

  }
  if (name === "place_crowd" && r.level) {
    return `<div class="card widget small"><b>${esc(r.place)}</b> ${r.month}월 ${LV(r.level)} <span class="muted">· 한산한 달: ${r.quietest_months.map((m) => m + "월").join(", ") || "-"}</span></div>`;
  }
  return "";
}
function addCard(turn, r) {
  const url = "/api/cards/" + r.image.split("/").pop() + "?t=" + Date.now();
  const kind = { feed: "인스타그램 피드 1080×1080", story: "스토리 1080×1920", menu: "메뉴판 1080×1350" }[r.format] || "";
  const box = document.createElement("div"); box.className = "card card-out widget";
  box.innerHTML = `<img src="${url}" alt="${kind}"><div class="row small muted" style="margin-top:8px">
    <span class="badge ${r.preview_only ? "lv-보통" : "lv-한산"}">${r.preview_only ? "미리보기" : "확정"}</span>${kind}${r.uses_ai_background ? " · AI 생성 배경" : ""}
    <a href="${url}" download style="margin-left:auto">내려받기</a></div>`;
  if (r.preview_only) {
    const a = document.createElement("div"); a.className = "acts";
    a.innerHTML = `<button class="btn primary">네, 이대로 확정해요</button><button class="btn ghost">고쳐 주세요</button>`;
    const [ok, ed] = a.querySelectorAll("button");
    ok.onclick = () => { a.querySelectorAll("button").forEach((b) => (b.disabled = true)); send("네, 이대로 확정해 주세요."); };
    ed.onclick = () => { $("#input").value = "이렇게 고쳐 주세요: "; $("#input").focus(); autoGrow(); };
    box.appendChild(a);
  } else {
    const gal = store.get("gallery", []); gal.push({ url: url.split("?")[0], label: kind, ts: Date.now() }); store.set("gallery", gal.slice(-40));
  }
  turn.el.appendChild(box); turn.bubble = null; scrollDown();
}
function appendText(turn, t) {
  if (!turn.bubble) { turn.bubble = document.createElement("div"); turn.bubble.className = "bubble"; turn.text = ""; turn.el.appendChild(turn.bubble); }
  turn.text += t; turn.bubble.innerHTML = md(turn.text); scrollDown();
}
function showError(turn, msg) { const d = document.createElement("div"); d.className = "error"; d.textContent = msg; turn.el.appendChild(d); scrollDown(); }

async function send(text) {
  if (chat.busy) return;
  if (current !== "chat") go("chat");
  text = (text ?? $("#input").value).trim();
  if (!text && !attached) return;
  chat.busy = true; $("#sendBtn").disabled = true;
  $("#intro")?.remove();
  const file = attached;
  addUser(text, file ? URL.createObjectURL(file) : null);
  $("#input").value = ""; autoGrow(); clearAttach();
  const fd = new FormData();
  fd.append("message", text); fd.append("mode", mode); fd.append("session_id", chat.sessionId);
  if (file) fd.append("image", file);
  const turn = newTurn();
  try {
    let code = store.get("accessCode", "");
    let res = await fetch("/api/chat", { method: "POST", body: fd, headers: code ? { "X-Access-Code": code } : {} });
    if (res.status === 401) {
      code = (prompt("데모 접속 코드를 입력해 주세요 (제출 페이지에 안내돼 있어요)") || "").trim(); store.set("accessCode", code);
      res = await fetch("/api/chat", { method: "POST", body: fd, headers: { "X-Access-Code": code } });
    }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `오류 ${res.status}`);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!chunk.startsWith("data: ")) continue;
        const ev = JSON.parse(chunk.slice(6));
        if (ev.type === "session") chat.sessionId = ev.session_id;
        else if (ev.type === "text") appendText(turn, ev.text);
        else if (ev.type === "tool_call") {
          turn.bubble = null;
          const li = document.createElement("li"); li.dataset.id = ev.id; li.textContent = STEP_LABEL[ev.name] || ev.name;
          turn.steps.querySelector("ol").appendChild(li); turn.steps.querySelector(".lbl").textContent = li.textContent + "…";
        } else if (ev.type === "tool_result") {
          const li = turn.steps.querySelector(`li[data-id="${ev.id}"]`); if (li) li.className = ev.is_error ? "err" : "done";
          if (ev.name === "render_card" && !ev.is_error && ev.result.image) addCard(turn, ev.result);
          else if (!ev.is_error) { const w = widgetFor(ev.name, ev.result); if (w) { turn.el.insertAdjacentHTML("beforeend", w); turn.bubble = null; scrollDown(); } }
        } else if (ev.type === "error") showError(turn, ev.message);
      }
    }
  } catch (e) { showError(turn, e.message || "연결이 끊겼어요. 다시 시도해 주세요."); }
  finally {
    turn.steps.querySelector(".spin")?.remove();
    const n = turn.steps.querySelectorAll("li").length;
    if (n) turn.steps.querySelector(".lbl").textContent = `데이터·도구 ${n}번 사용 · 자세히`; else turn.steps.remove();
    chat.busy = false; $("#sendBtn").disabled = false;
  }
}
function autoGrow() { const i = $("#input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 160) + "px"; }
$("#input").addEventListener("input", autoGrow);
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("#form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("#attachBtn").onclick = () => $("#file").click();
$("#file").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 5 * 1024 * 1024) { alert("사진은 5MB 이하로 올려 주세요."); return; }
  attached = f;
  const p = $("#attachPreview"); p.querySelector("img").src = URL.createObjectURL(f); p.style.display = "flex";
  go("chat");
  if (pendingPhotoText) { $("#input").value = pendingPhotoText; pendingPhotoText = ""; }
  else if (!$("#input").value) $("#input").value = mode === "owner" ? "이 사진으로 메뉴판 만들어 주세요. 가게 이름은 " : "";
  $("#input").focus(); autoGrow();
};
function clearAttach() { attached = null; $("#file").value = ""; $("#attachPreview").style.display = "none"; }
$("#attachClear").onclick = (e) => { e.preventDefault(); clearAttach(); };

// 음성 입력 (브라우저 기능, 무료)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR(); rec.lang = "ko-KR"; rec.interimResults = true; let on = false, base = "";
  $("#micBtn").hidden = false;
  $("#micBtn").onclick = () => { if (on) { rec.stop(); return; } base = $("#input").value; try { rec.start(); } catch {} };
  rec.onstart = () => { on = true; $("#micBtn").classList.add("on"); };
  rec.onend = () => { on = false; $("#micBtn").classList.remove("on"); };
  rec.onresult = (e) => { $("#input").value = base + Array.from(e.results).map((r) => r[0].transcript).join(""); autoGrow(); };
}

/* ================= 시작 ================= */
renderNav();
const startTab = location.hash.slice(1);
go(TABS[mode].some(([id]) => id === startTab) ? startTab : TABS[mode][0][0]);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
