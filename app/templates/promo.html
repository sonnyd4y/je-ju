<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { --ink: #1b1b1b; --paper: #fff8ec; --accent: #d9580b; --sea: #0f5c6e; --muted: #4f4b45; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: {{ w }}px; height: {{ h }}px; color: var(--ink); position: relative; overflow: hidden;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--sea) {% if bg %}url("{{ bg }}") center / cover no-repeat{% endif %};
  }
  .wrap { position: absolute; inset: {{ pad }}px; display: flex; flex-direction: column; justify-content: flex-end; gap: 28px; }
  .photo { flex: 1; min-height: 0; border-radius: 28px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.35); border: 8px solid var(--paper); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .panel {
    background: rgba(255, 248, 236, {{ 0.93 if bg else 1 }}); border-radius: 32px; padding: {{ 56 if story else 52 }}px 60px;
    {% if not bg and not photo %}flex: 1; display: flex; flex-direction: column;{% endif %}
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .tag { display: inline-block; background: var(--accent); color: #fff; font-size: 30px; font-weight: 800; padding: 10px 26px; border-radius: 999px; }
  h1 { font-size: {{ title_size }}px; font-weight: 900; line-height: 1.2; margin-top: 28px; word-break: keep-all; }
  .body { font-size: {{ body_size }}px; line-height: 1.55; margin-top: 22px; color: var(--muted); word-break: keep-all; white-space: pre-line; {% if not bg and not photo %}flex: 1;{% endif %} }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; border-top: 4px solid var(--ink); padding-top: 26px; margin-top: 30px; }
  .store { font-size: 50px; font-weight: 900; word-break: keep-all; }
  .addr { font-size: 25px; color: var(--muted); margin-top: 8px; word-break: keep-all; }
  .qr { text-align: center; font-size: 19px; color: var(--muted); flex-shrink: 0; }
  .qr img { width: 132px; height: 132px; display: block; margin-bottom: 4px; }
  .ai { position: absolute; right: 18px; top: 14px; font-size: 18px; color: rgba(255,255,255,.85); background: rgba(0,0,0,.35); padding: 4px 12px; border-radius: 999px; }
  .watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-24deg);
    font-size: 92px; font-weight: 900; color: rgba(217, 88, 11, 0.14); white-space: nowrap; pointer-events: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    {% if photo %}<div class="photo"><img src="{{ photo }}" alt=""></div>{% endif %}
    <div class="panel">
      <span class="tag">{{ region or "제주 동네가게" }}</span>
      <h1>{{ title }}</h1>
      <div class="body">{{ body }}</div>
      <div class="bottom">
        <div>
          <div class="store">{{ store_name }}</div>
          {% if address %}<div class="addr">{{ address }}</div>{% endif %}
        </div>
        {% if qr %}<div class="qr"><img src="{{ qr }}" alt="">지도·리뷰</div>{% endif %}
      </div>
    </div>
  </div>
  {% if bg %}<div class="ai">AI 생성 배경</div>{% endif %}
  {% if watermark %}<div class="watermark">미리보기 · 사장님 확인 전</div>{% endif %}
</body>
</html>
